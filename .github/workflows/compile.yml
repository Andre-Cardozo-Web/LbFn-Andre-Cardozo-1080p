name: Compilar LbFn PS2 ELF

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Permite compilar manualmente clicando no botão do GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Instalar utilitários adicionais
        run: |
          apk update && apk add --no-cache make sed findutils

      - name: Mapear pastas de inclusão e Compilar Projeto
        run: |
          # Procura a pasta real onde o arquivo ito.h está guardado no seu repositório
          ITO_DIR=$(dirname $(find . -name "ito.h" | head -n 1))
          echo "Pasta encontrada para o ito.h: $ITO_DIR"
          
          # Injeta as flags de compatibilidade e os caminhos dinamicamente no topo do Makefile
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\nEE_INCS += -I$ITO_DIR -I. -ILibito0.2.1modify\n|" Makefile
          
          # Executa a compilação
          make

      - name: Disponibilizar o arquivo ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-Optimized-PS2-ELF
          path: |
            *.ELF
            *.elf
