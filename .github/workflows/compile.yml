name: Compilar LbFn PS2 ELF

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Permite compilar manualmente clicando no botão do GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Instalar o utilitário Make
        run: |
          apk update && apk add --no-cache make sed

      - name: Configurar e Compilar Projeto
        run: |
          # Adiciona caminhos genéricos e compatibilidade newlib direto no Makefile
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\nEE_INCS += -I. -Ilibito -ILibito -ILibito0.2.1modify\n|" Makefile
          
          # Mostra os arquivos do repositório no log para sabermos o que está faltando
          echo "=== LISTA DE ARQUIVOS NO REPOSITÓRIO ==="
          ls -R
          echo "========================================"
          
          # Executa a compilação
          make

      - name: Disponibilizar o arquivo ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-Optimized-PS2-ELF
          path: |
            *.ELF
            *.elf
