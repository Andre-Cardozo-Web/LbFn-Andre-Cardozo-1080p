name: Compilar LbFn PS2 ELF

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Instalar o utilitário Make
        run: |
          apk update && apk add --no-cache make sed

      - name: Criar Biblioteca de Vídeo Virtual e Compilar
        run: |
          # Cria um arquivo ito.h temporário para o compilador não reclamar
          echo '#define itoNoVSync()' > ito.h
          echo '#define itoVSync()' >> ito.h
          
          # Injeta a compatibilidade legada e aponta a pasta raiz no Makefile
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\nEE_INCS += -I.\n|" Makefile
          
          # Remove a dependência de compilar módulos IRX que já estão prontos
          sed -i 's|cd modules && make||g' Makefile || true
          
          # Executa a compilação principal
          make

      - name: Disponibilizar o arquivo ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-Optimized-PS2-ELF
          path: |
            *.ELF
            *.elf
