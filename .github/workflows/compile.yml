name: Compilar LbFn Andre Cardozo 1080p

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte do Repositório
        uses: actions/checkout@v4

      - name: Instalar utilitários de compilação
        run: |
          apk update && apk add --no-cache make sed

      - name: Injetar Sincronismo contra Tela Preta e Falhas Piscantes
        run: |
          # 1. Copia todos os arquivos da biblioteca modificada para a raiz
          cp -r Libito0.2.1modify/* . || true
          cp Libito0.2.1modify/*.h . || true
          
          # 2. Copia os arquivos também para a pasta do loader por segurança
          mkdir -p loader
          cp -r Libito0.2.1modify/* loader/ || true
          cp Libito0.2.1modify/*.h loader/ || true
          
          # 3. Resolve os cabeçalhos ausentes e inclui a biblioteca de CD/DVD moderna no launchelf.h
          sed -i '24d' launchelf.h
          sed -i 's|<cdvd_rpc.h>|<libcdvd.h>|g' launchelf.h
          
          # 4. CORREÇÃO DOS ERROS DE LEITURA DO MAIN.C:
          # Corrige o erro de digitação do desenvolvedor de smid para smod
          sed -i 's|smid_get_mod_by_name|smod_get_mod_by_name|g' main.c
          # Injeta a declaração da função de vídeo itoInit() no topo do main.c para o compilador aceitar
          sed -i '2i\int itoInit(void);' main.c
          
          # 5. Ajusta o Makefile local e força a compatibilidade com drivers de vídeo legados
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE -I. -ILibito0.2.1modify\nEE_INCS += -I. -ILibito0.2.1modify\n|" Makefile
          
          # 6. Injeta o reset do barramento gráfico (V-Sync Lock) direto no renderizador do viewer.c
          sed -i 's|itoVSync();|itoNoVSync(); itoVSync();|g' viewer.c

      - name: Compilar Projeto Completo LbFn ELF
        run: |
          make clean
          make
          
      - name: Disponibilizar o arquivo LbFn ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-AndreCardozo-Optimized-ELF
          path: |
            *.ELF
            *.elf
