name: Compilar LbFn Otimizado PS2 ELF

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o seu código-fonte
        uses: actions/checkout@v4
        with:
          path: seu_codigo

      - name: Baixar Base Limpa do LaunchELF Oficial
        uses: actions/checkout@v4
        with:
          repository: ps2homebrew/wLaunchELF
          path: base_uLE

      - name: Instalar utilitários de sistema
        run: |
          apk update && apk add --no-cache make sed

      - name: Injetar a Correção do Emulador e Compilar
        run: |
          # Copia o SEU arquivo viewer.c corrigido por cima da base oficial estável
          cp seu_codigo/viewer.c base_uLE/src/viewer.c || cp seu_codigo/LbFn-Andre-Cardozo-1080p-master/viewer.c base_uLE/src/viewer.c || true
          
          cd base_uLE
          
          # Injeta a flag de compatibilidade necessária para o SDK moderno
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\n|" Makefile
          
          # Executa a compilação oficial estável
          make

      - name: Disponibilizar o arquivo ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-NES-Optimized-ELF
          path: |
            base_uLE/*.ELF
            base_uLE/*.elf
