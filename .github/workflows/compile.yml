name: Compilar LbFn Otimizado PS2 ELF

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o seu código-fonte
        uses: actions/checkout@v4

      - name: Instalar utilitários de sistema
        run: |
          apk update && apk add --no-cache make sed git

      - name: Baixar Base Limpa do LaunchELF Oficial
        run: |
          # Traz a árvore estável do LaunchELF com todas as dependências inclusas
          git clone https://github.com base_uLE
          
          # Copia o SEU arquivo viewer.c (com a nossa correção do NES) para dentro da base limpa
          cp viewer.c base_uLE/src/viewer.c || cp LbFn-Andre-Cardozo-1080p-master/viewer.c base_uLE/src/viewer.c || true

      - name: Compilar Projeto com Correção Anti-Flicker
        run: |
          cd base_uLE
          
          # Injeta a flag de compatibilidade necessária para o SDK moderno
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\n|" Makefile
          
          # Executa a compilação oficial estável
          make

      - name: Disponibilizar o arquivo ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-NES-Optimized-ELF
          path: |
            base_uLE/*.ELF
            base_uLE/*.elf
