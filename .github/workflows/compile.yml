name: Compilar LbFn Andre Cardozo 1080p

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte do Repositório
        uses: actions/checkout@v4

      - name: Instalar utilitários de compilação
        run: |
          apk update && apk add --no-cache make sed

      - name: Injetar Sincronismo contra Tela Preta e Falhas Piscantes
        run: |
          # 1. Copia todos os arquivos da biblioteca modificada para a raiz
          cp -r Libito0.2.1modify/* . || true
          cp Libito0.2.1modify/*.h . || true
          
          # 2. Copia os arquivos também para a pasta do loader por segurança
          mkdir -p loader
          cp -r Libito0.2.1modify/* loader/ || true
          cp Libito0.2.1modify/*.h loader/ || true
          
          # 3. APAGA COMPLETAMENTE a linha 24 que causa o erro de falta do arquivo ito.h
          sed -i '24d' launchelf.h
          
          # 4. Ajusta o Makefile para aceitar as inclusões locais na raiz
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\nEE_INCS += -I. -ILibito0.2.1modify\n|" Makefile
          
          # 5. Injeta o reset do barramento gráfico (V-Sync Lock) direto no renderizador
          sed -i 's|itoVSync();|itoNoVSync(); itoVSync();|g' viewer.c

      - name: Compilar Projeto Completo LbFn ELF
        run: |
          make clean
          make
          
      - name: Disponibilizar o arquivo LbFn ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-AndreCardozo-Optimized-ELF
          path: |
            *.ELF
            *.elf
