name: Compilar LbFn Andre Cardozo 1080p

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte do Repositório
        uses: actions/checkout@v4

      - name: Instalar utilitários de compilação
        run: |
          apk update && apk add --no-cache make sed

      - name: Injetar Sincronismo contra Tela Preta e Falhas Piscantes
        run: |
          # 1. Corrige as rotas de inclusão no Makefile principal para a pasta correta da Libito
          sed -i "1s|^|EE_INCS += -ILbFn-Andre-Cardozo-1080p-master/Libito0.2.1modify -I. -ILibito0.2.1modify\nEE_CFLAGS += -DNEWLIB_PORT_AWARE\n|" LbFn-Andre-Cardozo-1080p-master/Makefile
          
          # 2. Injeta o reset do barramento gráfico (V-Sync Lock) direto no renderizador antes do build
          # Isso impede o estouro de buffer de VRAM que gerava as telas pretas e as piscadas grotescas
          sed -i 's|itoVSync();|itoNoVSync(); itoVSync();|g' LbFn-Andre-Cardozo-1080p-master/viewer.c

      - name: Compilar Projeto Completo LbFn ELF
        run: |
          cd LbFn-Andre-Cardozo-1080p-master
          make clean
          make

      - name: Disponibilizar o arquivo LbFn ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-AndreCardozo-Optimized-ELF
          path: |
            LbFn-Andre-Cardozo-1080p-master/*.ELF
            LbFn-Andre-Cardozo-1080p-master/*.elf
