name: Compilar LbFn Andre Cardozo 1080p

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte do Repositório
        uses: actions/checkout@v4

      - name: Instalar utilitários de compilação
        run: |
          apk update && apk add --no-cache make sed

      - name: Injetar Sincronismo contra Tela Preta e Falhas Piscantes
        run: |
          # 1. Copia todos os arquivos .h e .c da Libito direto para a raiz para o compilador achar de primeira
          cp -r Libito0.2.1modify/* . || true
          
          # 2. Copia os arquivos também para dentro da pasta do loader por segurança
          mkdir -p loader
          cp -r Libito0.2.1modify/* loader/ || true
          
          # 3. Força a inclusão da raiz atual no arquivo global do compilador PS2DEV no sistema do GitHub
          sed -i "1s|^|EE_INCS += -I. -I./Libito0.2.1modify\nEE_CFLAGS += -DNEWLIB_PORT_AWARE\n|" /usr/local/ps2dev/ps2sdk/samples/Makefile.eeglobal
          
          # 4. Injeta a compatibilidade newlib legada diretamente no topo do Makefile local
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\nEE_INCS += -I.\n|" Makefile
          
          # 5. Injeta o reset do barramento gráfico (V-Sync Lock) direto no renderizador antes do build
          sed -i 's|itoVSync();|itoNoVSync(); itoVSync();|g' viewer.c

      - name: Compilar Projeto Completo LbFn ELF
        run: |
          make clean
          make
          
      - name: Disponibilizar o arquivo LbFn ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-AndreCardozo-Optimized-ELF
          path: |
            *.ELF
            *.elf
