name: Compilar LbFn PS2 ELF

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Configurar ambiente oficial PS2DEV
        uses: ps2dev/setup-ps2dev@v1
        with:
          packages: ps2sdk gskit

      - name: Configurar e Compilar Projeto
        run: |
          # Injeta a compatibilidade newlib e aponta os caminhos para o SDK e o gsKit oficial
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\nEE_INCS += -I. -I\$(PS2DEV)/gsKit/include -I\$(PS2DEV)/gsKit/ee/include\n|" Makefile
          
          # Ajusta a chamada do cabeçalho de vídeo para usar o padrão universal do sistema
          sed -i 's|<ito.h>|<gsKit.h>|g' launchelf.h
          
          # Executa a compilação principal
          make

      - name: Disponibilizar o arquivo ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-Optimized-PS2-ELF
          path: |
            *.ELF
            *.elf
