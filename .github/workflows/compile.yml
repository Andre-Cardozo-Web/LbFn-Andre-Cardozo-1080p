name: Compilar LbFn Andre Cardozo 1080p

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte do Repositório
        uses: actions/checkout@v4

      - name: Instalar utilitários de compilação
        run: |
          apk update && apk add --no-cache make sed

      - name: Injetar Sincronismo contra Tela Preta e Falhas Piscantes
        run: |
          # 1. Injeta de forma forçada a flag e a rota absoluta no topo do Makefile para achar o ito.h
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\nEE_INCS := -I\$(PWD)/Libito0.2.1modify \$(EE_INCS)\n|" Makefile
          
          # 2. Faz o mesmo ajuste no Makefile da pasta do Loader para manter o alinhamento
          if [ -f loader/Makefile ]; then
            sed -i "1s|^|EE_INCS := -I\$(PWD)/../Libito0.2.1modify \$(EE_INCS)\n|" loader/Makefile
          fi
          
          # 3. Injeta o reset do barramento gráfico (V-Sync Lock) direto no renderizador antes do build
          sed -i 's|itoVSync();|itoNoVSync(); itoVSync();|g' viewer.c

      - name: Compilar Projeto Completo LbFn ELF
        run: |
          # Força as variáveis globais de ambiente no terminal antes de chamar o Makefile
          export EE_INCS="-I$(pwd)/Libito0.2.1modify -I$(pwd)"
          make clean
          make
          
      - name: Disponibilizar o arquivo LbFn ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-AndreCardozo-Optimized-ELF
          path: |
            *.ELF
            *.elf
