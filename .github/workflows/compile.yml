name: Compilar LbFn PS2 ELF

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Permite compilar manualmente clicando no botão do GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Instalar o utilitário Make
        run: |
          apk update && apk add --no-cache make sed

      - name: Compilar Projeto Completo LbFn ELF
        run: |
          # Modifica o Makefile inserindo a compatibilidade newlib e as pastas das bibliotecas modificadas
          sed -i '1s/^/EE_CFLAGS += -DNEWLIB_PORT_AWARE\nEE_INCS += -ILibito0.2.1modify -I.\n/' Makefile
          
          # Executa a compilação limpa
          make
          
      - name: Disponibilizar o arquivo ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-Optimized-PS2-ELF
          path: |
            *.ELF
            *.elf
