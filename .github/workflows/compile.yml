name: Compilar LbFn com QuickNES

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o seu código-fonte
        uses: actions/checkout@v4
        with:
          path: seu_codigo

      - name: Baixar Base Limpa do LaunchELF Oficial
        uses: actions/checkout@v4
        with:
          repository: ps2homebrew/wLaunchELF
          path: base_uLE

      - name: Baixar Core QuickNES Oficial (Link Corrigido)
        uses: actions/checkout@v4
        with:
          repository: libretro/QuickNES_Core
          path: quicknes_core

      - name: Instalar utilitários de sistema
        run: |
          apk update && apk add --no-cache make sed

      - name: Vincular QuickNES e Compilar Unificado
        run: |
          # Estrutura a pasta do QuickNES dentro do ambiente de compilação
          mkdir -p base_uLE/quicknes
          cp -r quicknes_core/* base_uLE/quicknes/
          
          # Injeta o seu viewer.c corrigido por cima da base oficial
          cp seu_codigo/viewer.c base_uLE/viewer.c
          
          # Cria um arquivo ito.h virtual para manter a compatibilidade com o seu código enviado
          echo '#define itoNoVSync()' > base_uLE/ito.h
          echo '#define itoVSync()' >> base_uLE/ito.h
          echo '#define itoGsFinish()' >> base_uLE/ito.h
          echo '#define itoPoint(p, x, y, z)' >> base_uLE/ito.h
          
          cd base_uLE
          
          # Configura as flags globais de compilação diretamente no Makefile
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE -I. -Iquicknes\n|" Makefile
          
          # Desativa chamadas de drivers ausentes apontando para a raiz correta do arquivo
          sed -i 's|<cdvd_rpc.h>|<libcdvd.h>|g' launchelf.h
          
          # Executa a compilação geral do ELF unificado
          make

      - name: Disponibilizar o arquivo ELF com QuickNES
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-QuickNES-PS2-ELF
          path: |
            base_uLE/*.ELF
            base_uLE/*.elf
