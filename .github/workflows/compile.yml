name: Compilar LbFn PS2 ELF

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Permite compilar manualmente clicando no botão do GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Instalar utilitários e baixar biblioteca de vídeo faltando
        run: |
          apk update && apk add --no-cache make sed git
          
          # Baixa a biblioteca gráfica oficial do PS2DEV diretamente para o seu ambiente de compilação
          git clone https://github.com
          cd gsKit
          # Compila e instala a biblioteca de vídeo no sistema do GitHub
          make && make install
          cd ..

      - name: Configurar e Compilar Projeto
        run: |
          # Redireciona o código antigo para usar as chamadas modernas de vídeo instaladas
          sed -i "1s|^|EE_CFLAGS += -DNEWLIB_PORT_AWARE\nEE_INCS += -I. -I/usr/local/ps2dev/gsKit/include -I/usr/local/ps2dev/gsKit/ee/include\n|" Makefile
          
          # Substitui a chamada do ito.h pelo cabeçalho padrão de vídeo do PS2
          sed -i 's|<ito.h>|<gsKit.h>|g' launchelf.h
          
          # Executa a compilação
          make

      - name: Disponibilizar o arquivo ELF Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: LbFn-Optimized-PS2-ELF
          path: |
            *.ELF
            *.elf
